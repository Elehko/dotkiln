name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  pack:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Dotkiln.sln

      - name: Build
        run: dotnet build Dotkiln.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test Dotkiln.sln --configuration Release --no-build --nologo

      - name: Pack CLI
        run: dotnet pack src/Elehko.Dotkiln.Cli/Elehko.Dotkiln.Cli.csproj --configuration Release --no-build --output artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: elehgilbert

      - name: Push to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
